<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Подключение ESP32</title>
<style>
:root{--bg:#fff;--fg:#1f1f1d;--mut:#5f5e5a;--line:#444441;--box:#f1efe8;--boxs:#888780;--el:#e6f1fb;--els:#185fa5;--elt:#0c447c;--fu:#faeeda;--fus:#854f0b;--fut:#633806;--esp:#26215c;--espt:#eeedfe;--red:#a32d2d;--opt:#888780}
@media (prefers-color-scheme:dark){:root{--bg:#1e1e1c;--fg:#eceae4;--mut:#b4b2a9;--line:#b4b2a9;--box:#2c2c2a;--boxs:#888780;--el:#0c447c;--els:#85b7eb;--elt:#e6f1fb;--fu:#633806;--fus:#ef9f27;--fut:#faeeda;--esp:#3c3489;--espt:#eeedfe;--red:#f09595;--opt:#b4b2a9}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",sans-serif}
h1{font-size:18px;font-weight:500;margin:0 0 12px}
svg{width:100%;max-width:960px;height:auto;display:block}
text{font-family:system-ui,"Segoe UI",sans-serif;fill:var(--fg)}
.t{font-size:14px;font-weight:500}.s{font-size:12px;fill:var(--mut)}.p{font-size:13px;font-weight:500;fill:var(--espt)}
.box{fill:var(--box);stroke:var(--boxs)}.el{fill:var(--el);stroke:var(--els)}.elt{fill:var(--elt)}
.fu{fill:var(--fu);stroke:var(--fus)}.fut{fill:var(--fut)}
.esp{fill:var(--esp);stroke:var(--esp)}.r{fill:var(--bg);stroke:var(--line);stroke-width:1.5}
.w{stroke:var(--line);stroke-width:1.5;fill:none}.o{stroke:var(--opt);stroke-width:1.5;fill:none;stroke-dasharray:6 4}
.bad{font-size:12px;fill:var(--red)}.dot{fill:var(--line)}
</style></head><body>
<h1>Подключение ESP32 DevKit V1</h1>
<svg viewBox="0 0 900 650" role="img" aria-label="Схема подключения ESP32">

<!-- ESP32 board -->
<rect class="esp" x="380" y="110" width="180" height="450" rx="8"/>
<rect x="400" y="120" width="140" height="40" rx="4" fill="none" stroke="var(--espt)" stroke-dasharray="4 3"/>
<text class="p" x="470" y="145" text-anchor="middle">антенна</text>
<text class="p" x="470" y="230" text-anchor="middle">ESP32</text>
<text class="p" x="470" y="250" text-anchor="middle">DevKit V1</text>
<text class="p" x="470" y="300" text-anchor="middle">⋮</text>
<rect x="440" y="545" width="60" height="30" rx="3" fill="var(--box)" stroke="var(--boxs)"/>
<text class="s" x="470" y="565" text-anchor="middle">USB</text>
<!-- left pins -->
<text class="p" x="392" y="365">D14</text><text class="p" x="392" y="405">D12</text><text class="p" x="392" y="445">D13</text><text class="p" x="392" y="485">GND</text><text class="p" x="392" y="525">VIN</text>
<!-- right pins -->
<text class="p" x="548" y="365" text-anchor="end">D4</text><text class="p" x="548" y="405" text-anchor="end">D2</text><text class="p" x="548" y="445" text-anchor="end">D15</text><text class="p" x="548" y="485" text-anchor="end">GND</text><text class="p" x="548" y="525" text-anchor="end">3V3</text>

<text class="bad" x="300" y="405" text-anchor="end">D12 не трогать</text>
<text class="bad" x="568" y="405">D2 не трогать</text>
<text class="bad" x="568" y="445">D15 не трогать</text>

<!-- BLE -->
<rect class="box" x="680" y="115" width="190" height="56" rx="8"/>
<text class="t" x="775" y="139" text-anchor="middle">JK BMS «1M47S»</text>
<text class="s" x="775" y="158" text-anchor="middle">Bluetooth, без проводов</text>
<path class="o" d="M560 140 H678"/>

<!-- Power: battery -> F4 -> 5V module -->
<text class="s" x="20" y="512">+ батареи</text>
<rect class="fu" x="90" y="500" width="60" height="26" rx="4"/><text class="t fut" x="120" y="518" text-anchor="middle">F4 2 А</text>
<line class="w" x1="78" y1="513" x2="90" y2="513"/>
<line class="w" x1="150" y1="513" x2="170" y2="513"/>
<text class="s" x="20" y="602">P− BMS (общий минус)</text>
<path class="w" d="M150 598 H190 V560"/>
<rect class="el" x="170" y="478" width="130" height="82" rx="8"/>
<text class="t elt" x="235" y="505" text-anchor="middle">Модуль 5 В</text>
<text class="s" x="235" y="524" text-anchor="middle">выставить 5,0 В</text>
<text class="s" x="235" y="541" text-anchor="middle">до подключения!</text>
<line class="w" x1="300" y1="520" x2="380" y2="520"/>
<text class="s" x="340" y="514" text-anchor="middle">+5 В</text>
<line class="w" x1="300" y1="480" x2="380" y2="480"/>

<!-- Divider on D13 -->
<text class="s" x="20" y="436">+24 В PROLUM</text>
<text class="s" x="20" y="452">(клемма IN+ XL4016)</text>
<line class="w" x1="140" y1="440" x2="190" y2="440"/>
<rect class="r" x="190" y="431" width="70" height="18" rx="2"/><text class="s" x="225" y="425" text-anchor="middle">R1 100 кОм</text>
<line class="w" x1="260" y1="440" x2="380" y2="440"/>
<circle class="dot" cx="330" cy="440" r="3"/>
<rect class="r" x="322" y="450" width="16" height="22" rx="2"/>
<text class="s" x="316" y="466" text-anchor="end">R2 20 кОм</text>
<circle class="dot" cx="360" cy="440" r="3"/>
<rect class="r" x="352" y="450" width="16" height="22" rx="2"/>
<text class="s" x="360" y="425" text-anchor="middle">R3 47к</text>
<line class="w" x1="360" y1="440" x2="360" y2="450"/>
<line class="w" x1="360" y1="472" x2="360" y2="480"/>
<circle class="dot" cx="360" cy="480" r="3"/>
<line class="w" x1="330" y1="440" x2="330" y2="450"/>
<line class="w" x1="330" y1="472" x2="330" y2="480"/>
<circle class="dot" cx="330" cy="480" r="3"/>

<!-- Optional fan on D14 -->
<rect class="box" x="150" y="335" width="160" height="50" rx="8" stroke-dasharray="5 3"/>
<text class="t" x="230" y="356" text-anchor="middle">MOSFET + вентилятор</text>
<text class="s" x="230" y="374" text-anchor="middle">по желанию</text>
<path class="o" d="M310 360 H380"/>

<!-- Optional DS18B20 on D4 -->
<rect class="box" x="700" y="330" width="170" height="56" rx="8" stroke-dasharray="5 3"/>
<text class="t" x="785" y="354" text-anchor="middle">DS18B20</text>
<text class="s" x="785" y="373" text-anchor="middle">t° в коробке, по желанию</text>
<path class="o" d="M560 360 H698"/>
<circle class="dot" cx="690" cy="360" r="3"/>
<rect class="r" x="682" y="420" width="16" height="30" rx="2" stroke-dasharray="4 2"/>
<text class="s" x="706" y="440">4,7 кОм</text>
<path class="o" d="M690 360 V420"/><path class="o" d="M690 450 V520"/>
<circle class="dot" cx="690" cy="520" r="3"/>
<path class="o" d="M560 520 H830 V388"/>
<path class="o" d="M560 480 H775 V388"/>
<text class="s" x="783" y="410">GND</text><text class="s" x="838" y="410">3V3</text>

<!-- Legend -->
<line class="w" x1="20" y1="630" x2="60" y2="630"/><text class="s" x="68" y="634">обязательно</text>
<line class="o" x1="180" y1="630" x2="220" y2="630"/><text class="s" x="228" y="634">по желанию / Bluetooth</text>
<text class="s" x="420" y="634">D13: ~3,0 В есть свет, 0 — нет · R2∥R3 ≈ 14 кОм · все GND общие (P− BMS)</text>
</svg>
</body></html>
