<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Схема ИБП для ПК</title>
<style>
:root{--bg:#fff;--fg:#1f1f1d;--mut:#5f5e5a;--line:#444441;--box:#f1efe8;--boxs:#888780;--el:#e6f1fb;--els:#185fa5;--elt:#0c447c;--fu:#faeeda;--fus:#854f0b;--fut:#633806;--di:#e1f5ee;--dis:#0f6e56;--dit:#085041;--bat:#eaf3de;--bats:#3b6d11;--batt:#27500a}
@media (prefers-color-scheme:dark){:root{--bg:#1e1e1c;--fg:#eceae4;--mut:#b4b2a9;--line:#b4b2a9;--box:#2c2c2a;--boxs:#888780;--el:#0c447c;--els:#85b7eb;--elt:#e6f1fb;--fu:#633806;--fus:#ef9f27;--fut:#faeeda;--di:#085041;--dis:#5dcaa5;--dit:#e1f5ee;--bat:#27500a;--bats:#97c459;--batt:#eaf3de}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",sans-serif}
h1{font-size:18px;font-weight:500;margin:0 0 12px}
svg{width:100%;max-width:1000px;height:auto;display:block}
text{font-family:system-ui,"Segoe UI",sans-serif;fill:var(--fg)}
.t{font-size:14px;font-weight:500}.s{font-size:12px;fill:var(--mut)}
.box{fill:var(--box);stroke:var(--boxs)}.el{fill:var(--el);stroke:var(--els)}.el+text,.elt{fill:var(--elt)}
.fu{fill:var(--fu);stroke:var(--fus)}.fut{fill:var(--fut)}.di{fill:var(--di);stroke:var(--dis)}.dit{fill:var(--dit)}
.bat{fill:var(--bat);stroke:var(--bats)}.batt{fill:var(--batt)}
.w{stroke:var(--line);stroke-width:1.5;fill:none}.dash{stroke-dasharray:6 4}
</style></head><body>
<h1>Схема ИБП для ПК и монитора</h1>
<svg viewBox="0 0 1000 720" role="img" aria-label="Схема подключения ИБП">
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5"/></marker></defs>

<!-- Battery -->
<rect class="bat" x="30" y="90" width="190" height="540" rx="10" stroke-width="1.5"/>
<text class="t batt" x="125" y="330" text-anchor="middle">Батарея</text>
<text class="s" x="125" y="352" text-anchor="middle">4× EVE LF100LA</text>
<text class="s" x="125" y="370" text-anchor="middle">12,8 В 100 А·ч</text>
<text class="s" x="125" y="388" text-anchor="middle">JK BMS 200 А</text>
<text class="s" x="125" y="420" text-anchor="middle">плюс: клемма элемента</text>
<text class="s" x="125" y="438" text-anchor="middle">минус: P− на BMS</text>
<text class="s" x="125" y="470" text-anchor="middle">в пластиковом ящике</text>

<!-- Row A: DAJING + DC-DC -> PC -->
<rect class="box" x="400" y="30" width="160" height="56" rx="8"/>
<text class="t" x="480" y="54" text-anchor="middle">Блок DAJING 19 В</text>
<text class="s" x="480" y="73" text-anchor="middle">от сети, в гнездо DC099</text>
<rect class="di" x="600" y="43" width="56" height="30" rx="4"/><text class="t dit" x="628" y="63" text-anchor="middle">D1</text>
<line class="w" x1="560" y1="58" x2="598" y2="58" marker-end="url(#a)"/>

<rect class="fu" x="250" y="135" width="80" height="30" rx="4"/><text class="t fut" x="290" y="155" text-anchor="middle">F2 15 А</text>
<line class="w" x1="220" y1="150" x2="248" y2="150" marker-end="url(#a)"/>
<text class="s" x="365" y="142" text-anchor="middle">12AWG</text>
<line class="w" x1="330" y1="150" x2="398" y2="150" marker-end="url(#a)"/>
<rect class="el" x="400" y="122" width="160" height="56" rx="8"/>
<text class="t elt" x="480" y="146" text-anchor="middle">DC-DC 400 Вт</text>
<text class="s" x="480" y="165" text-anchor="middle">12,8 → 18,5 В</text>
<rect class="di" x="600" y="135" width="56" height="30" rx="4"/><text class="t dit" x="628" y="155" text-anchor="middle">D2</text>
<line class="w" x1="560" y1="150" x2="598" y2="150" marker-end="url(#a)"/>

<path class="w" d="M656 58 H700 V150 H656"/>
<line class="w" x1="700" y1="104" x2="728" y2="104" marker-end="url(#a)"/>
<rect class="box" x="730" y="90" width="56" height="28" rx="4"/><text class="s" x="758" y="109" text-anchor="middle">XT60</text>
<line class="w" x1="786" y1="104" x2="818" y2="104" marker-end="url(#a)"/>
<rect class="box" x="820" y="76" width="160" height="56" rx="8"/>
<text class="t" x="900" y="100" text-anchor="middle">Мини-ПК</text>
<text class="s" x="900" y="119" text-anchor="middle">кабель 5,5×2,5, 16AWG</text>

<!-- Row B: FSP -> monitor -->
<text class="s" x="555" y="250" text-anchor="middle">сеть 220 В</text>
<line class="w" x1="555" y1="258" x2="555" y2="298" marker-end="url(#a)"/>
<rect class="fu" x="250" y="315" width="80" height="30" rx="4"/><text class="t fut" x="290" y="335" text-anchor="middle">F1 40 А</text>
<line class="w" x1="220" y1="330" x2="248" y2="330" marker-end="url(#a)"/>
<text class="s" x="365" y="322" text-anchor="middle">10AWG</text>
<line class="w" x1="330" y1="330" x2="398" y2="330" marker-end="url(#a)"/>
<rect class="box" x="400" y="316" width="56" height="28" rx="4"/><text class="s" x="428" y="335" text-anchor="middle">XT60</text>
<line class="w" x1="456" y1="330" x2="478" y2="330" marker-end="url(#a)"/>
<rect class="box" x="480" y="300" width="160" height="60" rx="8"/>
<text class="t" x="560" y="325" text-anchor="middle">ИБП FSP iFP-800</text>
<text class="s" x="560" y="345" text-anchor="middle">вместо батареи 9 А·ч</text>
<line class="w" x1="640" y1="330" x2="818" y2="330" marker-end="url(#a)"/>
<rect class="box" x="820" y="302" width="160" height="56" rx="8"/>
<text class="t" x="900" y="326" text-anchor="middle">Монитор</text>
<text class="s" x="900" y="345" text-anchor="middle">ASUS VG279Q1A</text>

<!-- Row C: charger -->
<rect class="box" x="820" y="440" width="160" height="56" rx="8"/>
<text class="t" x="900" y="464" text-anchor="middle">PROLUM 24 В</text>
<text class="s" x="900" y="483" text-anchor="middle">150 Вт, от сети</text>
<line class="w" x1="820" y1="468" x2="762" y2="468" marker-end="url(#a)"/>
<rect class="el" x="600" y="440" width="160" height="56" rx="8"/>
<text class="t elt" x="680" y="464" text-anchor="middle">Зарядка XL4016</text>
<text class="s" x="680" y="483" text-anchor="middle">14,0 В / 6 А</text>
<line class="w" x1="600" y1="468" x2="532" y2="468" marker-end="url(#a)"/>
<rect class="di" x="474" y="453" width="56" height="30" rx="4"/><text class="t dit" x="502" y="473" text-anchor="middle">D3</text>
<line class="w" x1="474" y1="468" x2="332" y2="468" marker-end="url(#a)"/>
<text class="s" x="400" y="460" text-anchor="middle">14AWG</text>
<rect class="fu" x="250" y="453" width="80" height="30" rx="4"/><text class="t fut" x="290" y="473" text-anchor="middle">F3 10 А</text>
<line class="w" x1="250" y1="468" x2="222" y2="468" marker-end="url(#a)"/>

<!-- Row D: ESP -->
<rect class="fu" x="250" y="575" width="80" height="30" rx="4"/><text class="t fut" x="290" y="595" text-anchor="middle">F4 2 А</text>
<line class="w" x1="220" y1="590" x2="248" y2="590" marker-end="url(#a)"/>
<line class="w" x1="330" y1="590" x2="398" y2="590" marker-end="url(#a)"/>
<rect class="el" x="400" y="562" width="160" height="56" rx="8"/>
<text class="t elt" x="480" y="586" text-anchor="middle">Mini560</text>
<text class="s" x="480" y="605" text-anchor="middle">12,8 → 5 В</text>
<line class="w" x1="560" y1="590" x2="598" y2="590" marker-end="url(#a)"/>
<rect class="el" x="600" y="562" width="160" height="56" rx="8"/>
<text class="t elt" x="680" y="586" text-anchor="middle">ESP32 DevKit</text>
<text class="s" x="680" y="605" text-anchor="middle">Wi-Fi → Telegram</text>
<path class="w dash" d="M680 618 V665 H125 V632" marker-end="url(#a)"/>
<text class="s" x="400" y="657" text-anchor="middle">данные BMS: UART-порт GPS (без VBAT!) или Bluetooth</text>

<!-- Legend -->
<rect class="el" x="30" y="688" width="14" height="14" rx="3"/><text class="s" x="52" y="700">в коробке электроники 200×155×80</text>
<rect class="fu" x="290" y="688" width="14" height="14" rx="3"/><text class="s" x="312" y="700">предохранитель у плюса батареи</text>
<rect class="di" x="530" y="688" width="14" height="14" rx="3"/><text class="s" x="552" y="700">идеальный диод</text>
<text class="s" x="680" y="700">минусы всех веток → P− на BMS</text>
</svg>
</body></html>
