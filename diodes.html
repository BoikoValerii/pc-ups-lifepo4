<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Идеальные диоды D1–D3</title>
<style>
:root{--bg:#fff;--fg:#1f1f1d;--mut:#5f5e5a;--neg:#185fa5;--pos:#a32d2d;--box:#f1efe8;--boxs:#888780;--di:#e1f5ee;--dis:#0f6e56;--dit:#085041;--fu:#faeeda;--fus:#854f0b;--fut:#633806;--bat:#eaf3de;--bats:#3b6d11;--batt:#27500a}
@media (prefers-color-scheme:dark){:root{--bg:#1e1e1c;--fg:#eceae4;--mut:#b4b2a9;--neg:#85b7eb;--pos:#f09595;--box:#2c2c2a;--boxs:#888780;--di:#085041;--dis:#5dcaa5;--dit:#e1f5ee;--fu:#633806;--fus:#ef9f27;--fut:#faeeda;--bat:#27500a;--bats:#97c459;--batt:#eaf3de}}
body{margin:0;padding:16px;background:var(--bg);color:var(--fg);font-family:system-ui,"Segoe UI",sans-serif}
h1{font-size:18px;font-weight:500;margin:0 0 12px}
svg{width:100%;max-width:1000px;height:auto;display:block}
text{font-family:system-ui,"Segoe UI",sans-serif;fill:var(--fg)}
.t{font-size:14px;font-weight:500}.s{font-size:12px;fill:var(--mut)}.pin{font-size:11px;font-weight:600;fill:var(--dit)}
.box{fill:var(--box);stroke:var(--boxs)}.di{fill:var(--di);stroke:var(--dis);stroke-width:1.5}.dit{fill:var(--dit)}
.fu{fill:var(--fu);stroke:var(--fus)}.fut{fill:var(--fut)}.bat{fill:var(--bat);stroke:var(--bats);stroke-width:1.5}.batt{fill:var(--batt)}
.p{stroke:var(--pos);stroke-width:2.5;fill:none}.n{stroke:var(--neg);stroke-width:2.5;fill:none}
.pt{fill:var(--pos);font-size:12px;font-weight:600}.nt{fill:var(--neg);font-size:12px;font-weight:600}
.dp{fill:var(--pos)}.dn{fill:var(--neg)}.sym{fill:var(--dis);stroke:var(--dis)}.in{stroke:var(--dis);stroke-width:1;fill:none;stroke-dasharray:3 3}
</style></head><body>
<h1>Идеальные диоды XL74610: подключение по пинам</h1>
<svg viewBox="0 0 1000 600" role="img" aria-label="Подключение пинов идеальных диодов">

<!-- ===== D1 ===== -->
<rect class="box" x="30" y="35" width="190" height="80" rx="8"/>
<text class="t" x="125" y="62" text-anchor="middle">Блок DAJING 19 В</text>
<text class="pt" x="210" y="64" text-anchor="end">+</text><text class="nt" x="210" y="94" text-anchor="end">−</text>
<path class="p" d="M220 60 H400"/><path class="n" d="M220 90 H400"/>
<g transform="translate(400,40)">
<rect class="di" width="120" height="70" rx="6"/>
<text class="pin" x="6" y="24">IN</text><text class="pin" x="6" y="54">GND</text>
<text class="pin" x="114" y="24" text-anchor="end">OUT</text><text class="pin" x="114" y="54" text-anchor="end">GND</text>
<path class="sym" d="M48 12 L66 20 L48 28 Z"/><line x1="68" y1="11" x2="68" y2="29" stroke="var(--dis)" stroke-width="2"/>
<line class="in" x1="34" y1="50" x2="86" y2="50"/>
<text class="t dit" x="60" y="68" text-anchor="middle" font-size="12">D1</text>
</g>

<!-- ===== D2 ===== -->
<rect class="box" x="30" y="165" width="190" height="80" rx="8"/>
<text class="t" x="125" y="192" text-anchor="middle">Гнездо «к ПК»</text>
<text class="s" x="125" y="211" text-anchor="middle">DC-DC 18,5 В</text>
<text class="pt" x="210" y="194" text-anchor="end">+</text><text class="nt" x="210" y="224" text-anchor="end">−</text>
<path class="p" d="M220 190 H400"/><path class="n" d="M220 220 H400"/>
<g transform="translate(400,170)">
<rect class="di" width="120" height="70" rx="6"/>
<text class="pin" x="6" y="24">IN</text><text class="pin" x="6" y="54">GND</text>
<text class="pin" x="114" y="24" text-anchor="end">OUT</text><text class="pin" x="114" y="54" text-anchor="end">GND</text>
<path class="sym" d="M48 12 L66 20 L48 28 Z"/><line x1="68" y1="11" x2="68" y2="29" stroke="var(--dis)" stroke-width="2"/>
<line class="in" x1="34" y1="50" x2="86" y2="50"/>
<text class="t dit" x="60" y="68" text-anchor="middle" font-size="12">D2</text>
</g>

<!-- junction to PC -->
<path class="p" d="M520 60 H680 V190 H520"/>
<path class="n" d="M520 90 H630 V220 H520"/>
<circle class="dp" cx="680" cy="125" r="5"/><circle class="dn" cx="630" cy="160" r="5"/>
<path class="p" d="M680 125 H800"/><path class="n" d="M630 160 H800"/>
<rect class="box" x="800" y="100" width="170" height="85" rx="8"/>
<text class="t" x="885" y="135" text-anchor="middle">Мини-ПК</text>
<text class="s" x="885" y="154" text-anchor="middle">штекер 5,5×2,5</text>
<text class="pt" x="812" y="129">+</text><text class="nt" x="812" y="164">−</text>
<text class="s" x="700" y="115">+ вместе</text><text class="s" x="645" y="178">− вместе</text>

<!-- ===== D3 ===== -->
<rect class="box" x="30" y="325" width="190" height="80" rx="8"/>
<text class="t" x="125" y="352" text-anchor="middle">Гнездо «к АКБ»</text>
<text class="s" x="125" y="371" text-anchor="middle">XL4016 14,0 В</text>
<text class="pt" x="210" y="354" text-anchor="end">+</text><text class="nt" x="210" y="384" text-anchor="end">−</text>
<path class="p" d="M220 350 H400"/><path class="n" d="M220 380 H400"/>
<g transform="translate(400,330)">
<rect class="di" width="120" height="70" rx="6"/>
<text class="pin" x="6" y="24">IN</text><text class="pin" x="6" y="54">GND</text>
<text class="pin" x="114" y="24" text-anchor="end">OUT</text><text class="pin" x="114" y="54" text-anchor="end">GND</text>
<path class="sym" d="M48 12 L66 20 L48 28 Z"/><line x1="68" y1="11" x2="68" y2="29" stroke="var(--dis)" stroke-width="2"/>
<line class="in" x1="34" y1="50" x2="86" y2="50"/>
<text class="t dit" x="60" y="68" text-anchor="middle" font-size="12">D3</text>
</g>
<path class="p" d="M520 350 H600"/>
<rect class="fu" x="600" y="335" width="80" height="30" rx="4"/><text class="t fut" x="640" y="355" text-anchor="middle">F3 10 А</text>
<path class="p" d="M680 350 H800"/><path class="n" d="M520 380 H800"/>
<rect class="bat" x="800" y="325" width="170" height="80" rx="8"/>
<text class="t batt" x="885" y="368" text-anchor="middle">Батарея</text>
<text class="pt" x="812" y="354">+ клемма</text><text class="nt" x="812" y="398">− P− BMS</text>

<!-- Notes -->
<text class="s" x="30" y="450">Красный — плюс, синий — минус. Пунктир внутри модуля: два GND соединены между собой (минус проходит насквозь).</text>
<text class="s" x="30" y="472">IN — со стороны треугольника ▶ (источник), OUT — со стороны черты | (нагрузка).</text>
<text class="s" x="30" y="494">Минус можно не вести через модуль: тогда на один любой GND — тонкий провод от общего минуса.</text>
<text class="s" x="30" y="516">До пайки прозвонить: GND–GND пищит; GND–IN и GND–OUT не пищит.</text>
<text class="s" x="30" y="538">Перепутаешь IN/OUT на D1/D2 — ПК не получит питание от этого источника; на D3 — батарея не будет заряжаться.</text>
</svg>
</body></html>
